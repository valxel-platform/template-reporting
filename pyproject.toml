[project]
name = "reporting"
version = "0.1.0"
description = "Valxel reporting template: approved data contracts into reporting tables (Postgres, row-level security) and filtered topics for Kafka Connect, with per-field rules from each field's class."
requires-python = ">=3.12"
dependencies = [
  "confluent-kafka>=2.16,<3",
  "psycopg[binary]>=3.3.9,<4",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "prometheus-client>=0.23,<1",
  "pyyaml>=6.0,<7",
  "jsonschema>=4.20,<5",
  "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
  "opentelemetry-instrumentation-psycopg>=0.66b2",
  "sentry-sdk>=2.72,<3",
  # Signing in as the workload identity, with a token (GCP: Cloud SQL IAM; Azure: Microsoft Entra).
  "google-auth>=2.40,<3",
  "azure-identity>=1.25,<2",
]

[project.scripts]
reporting-sink = "reporting.app:main"
reporting-admin = "reporting.admin:main"

[dependency-groups]
dev = ["pytest>=9.2", "pytest-cov>=7.1", "ruff>=0.17", "mypy>=2.4", "types-pyyaml"]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reporting"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".github"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
strict = true
packages = ["reporting"]
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: needs REPORTING_TEST_DATABASE_URL"]
addopts = "-q --cov=reporting --cov-report=term --cov-report=xml --junitxml=reports/junit.xml"

[tool.coverage.report]
fail_under = 90
